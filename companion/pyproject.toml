[project]
name = "llm-deck-companion"
version = "0.1.0"
description = "PC 도우미: LLM 사용량을 모아 ESP32 기기로 보내고, 기기의 마이크 소리를 가상 오디오 장치로 내보낸다"
requires-python = ">=3.11"
dependencies = [
    "zeroconf>=0.130",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pyserial>=3.5",
    "bleak>=0.22",
    "psutil>=5.9",
    "faster-whisper>=1.1",
    # Apple Silicon Mac 은 GPU 로 받아 적는다 (assistant.py). 다른 PC 는 faster-whisper 를 쓴다
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
