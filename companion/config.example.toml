# 이 파일을 config.toml 로 복사한 뒤 필요한 값만 채우세요. (config.toml 은 git 에 올라가지 않습니다)
# 키를 비워 둔 서비스는 화면에 나타나지 않습니다.

[device]
# 연결 방식: "auto"(USB -> Wi-Fi -> 블루투스 순으로 되는 것), "usb", "ble", "wifi"
link = "auto"
# Wi-Fi: 비워 두면 기기를 자동으로 찾습니다. 못 찾을 때만 기기 화면에 보이는 IP 를 적으세요.
host = ""
# USB: 비워 두면 포트를 자동으로 찾습니다. (예: "/dev/cu.usbmodem101", "COM5")
port = ""

[claude_code]
# 구독 한도 사용률. PC 마다 한 번 설정해야 값이 들어옵니다 (Windows 는 install.cmd 가 한다. Mac 은 `uv run main.py --install-statusline`).
enabled = true

[codex]
# Codex(ChatGPT 구독) 한도 사용률. Codex CLI 를 쓴 적이 있으면 자동으로 나옵니다.
enabled = true

[api_cost]
# Claude Code / Codex 대화 기록의 토큰 수에 API 단가를 곱한 "API 로 썼다면 든 비용". 키 필요 없음.
enabled = true

[anthropic_api]
# 실제 API 청구액 (API 키로 쓴 것만, 구독 사용분은 안 들어감). 일반 API 키(sk-ant-api03-...)로는 안 되고 Admin 키여야 합니다.
# Anthropic Admin 키 (sk-ant-admin01-...). platform.claude.com/settings/admin-keys. 조직 계정에서만 만들 수 있습니다.
admin_key = ""
# 키를 만들 때 고른 만료일 (예: "2027-01-18"). 7일 전부터 화면에 알리고, 지나면 새 키를 넣으라고 알립니다. 만료 없음이면 비워 둡니다.
expires = ""
# 월 지출 한도 (USD, 예: 100). Anthropic 은 API 로 읽을 수 없어서 콘솔 '지출 한도' 값을 적습니다. 비우면 안 보입니다.
monthly_limit = ""
# 크레딧 잔액 (USD, 예: 99.52) 과 그 값을 본 날짜. 두 회사 모두 잔액 API 가 없어서, 적은 날부터 쓴 금액을 빼서 보여줍니다.
credit = ""
credit_date = ""

[openai_api]
# OpenAI Admin 키 (sk-admin-...). 일반 키(sk-proj-...)로는 안 됩니다. platform.openai.com > Settings > Organization > Admin keys
admin_key = ""
# 키를 만들 때 고른 만료일 (예: "2027-01-18"). 7일 전부터 화면에 알리고, 지나면 새 키를 넣으라고 알립니다. 만료 없음이면 비워 둡니다.
expires = ""
# 월 지출 한도 (USD). 비우면 OpenAI 에 설정된 조직 한도를 읽어 옵니다.
monthly_limit = ""
# 크레딧 잔액 (USD, 예: 99.52) 과 그 값을 본 날짜. 두 회사 모두 잔액 API 가 없어서, 적은 날부터 쓴 금액을 빼서 보여줍니다.
credit = ""
credit_date = ""

[sync]
# 한도 사용률을 여러 PC 가 함께 쓰기 위한 비공개 GitHub gist. 비워 두면 이 PC 의 값만 씁니다.
# 값을 내려받기만 하는 PC(Claude Code / Codex 가 없는 PC)는 gist_id 만 적으면 되고 로그인이 필요 없습니다.
# github_token: 비워 두면 GitHub CLI 로그인(`gh auth login -s gist`)을 씁니다.
#   gh 가 없는 PC 에서는 github.com > Settings > Developer settings > Personal access tokens 에서 gist 권한만 준 토큰을 적습니다.
# gist_id: 처음 한 번 Mac 에서 `uv run main.py --setup-sync` 로 만들고, 모든 PC 에 같은 값을 적습니다 (Windows 압축 파일에는 들어 있다).
github_token = ""
gist_id = ""

[audio]
# 마이크 소리를 내보낼 가상 오디오 장치 이름의 일부. 비워 두면 BlackHole(Mac) / CABLE Input(Windows) 을 찾습니다.
output = ""

# 기기가 보내는 알림에 맞춰 PC 스피커로 소리를 낸다.
#   mic_on "띠링", mic_off "띠롱", limit_warn 한도 80%/90% 넘음 "삐삐삐", limit_reset 한도 초기화 "도미솔도"
[sounds]
enabled = true
# 효과음 크기는 PC 를 따른다: Mac 은 시스템 설정 > 사운드의 "경고음 음량", Windows 는 PC 음량
# 원하는 소리 파일(.wav)로 바꿀 수 있다. 비워 두면 기본 효과음을 쓴다.
# mic_on = "/System/Library/Sounds/Tink.aiff"
# mic_off = "/System/Library/Sounds/Pop.aiff"

# 기기 카메라로 찍은 사진을 저장할 폴더. 비워 두면 사진 폴더 아래 "LLM Deck".
[photos]
dir = ""

# 기기 카메라로 녹화한 동영상(MOV)을 저장할 폴더. 비워 두면 Mac 은 동영상(Movies), Windows 는 비디오(Videos) 아래 "LLM Deck".
[videos]
dir = ""

# 기기 카메라의 QR·바코드 스캔 (카메라 화면의 QR 버튼). 읽은 값은 늘 클립보드에 넣는다.
[scan]
# true 면 바코드 스캐너처럼 지금 커서가 있는 곳에 읽은 값을 입력하고 Enter 를 누른다
# (엑셀 칸·웹 입력칸에 바로 들어간다. 엉뚱한 창에 들어갈 수 있어 기본은 끔)
type = false

[assistant]
# 기기에서 말로 묻고 글로 답받기. 음성은 이 PC 마이크로 받아 글자로 바꾼다
# (기본은 이 PC 안의 Whisper. 아래 stt = "chatgpt" 면 ChatGPT 로 보낸다).
# Claude CLI. 비워 두면 claude-test 를 먼저 찾고, 없으면 claude 를 쓴다.
# command = "claude-test"
# model = "sonnet"          # CLI 모델 (빈 글자면 CLI 기본값)
# idle_minutes = 30         # 이만큼 질문이 없으면 백그라운드 CLI 를 끈다
# whisper_model = "small"   # 음성 인식 모델 (tiny / base / small / medium / large-v3-turbo). 클수록 정확하고 느리다. 폴더 경로도 된다
#                           # Apple Silicon Mac 은 large-v3-turbo 를 권한다 (GPU 로 5초 말에 1초 안쪽, small 보다 오타가 적다)
# stt = "local"             # 받아 적기. "chatgpt" 면 ChatGPT 구독 계정으로 (API 키 필요 없음, Codex 에 ChatGPT 계정으로 로그인해 두어야 함).
#                           # 공개 API 가 아니라 막힐 수 있고, 실패하면 이 PC 의 Whisper 로 받아 적는다. 소리가 OpenAI 로 나가 30일 남는다
# engine = "auto"           # auto: Apple Silicon Mac 은 GPU(mlx), 그 밖은 CPU. "cpu" 면 늘 CPU
# beam_size = 1             # CPU 로 받아 적을 때. 5 면 30%쯤 느리고 조금 더 정확하다
# language = "ko"           # 받아 적을 말 (en, ja ...). "auto" 면 저절로 알아본다 (짧은 말은 틀리기 쉽다)
# prompt = "받아쓰기, 펌웨어, 빌드, 커밋, 깃, 세션, 오르카, 클로드, 기기, 배터리, 코드, 스킬."  # 자주 쓰는 말 (잘 알아듣게)
# input = ""                # 마이크 이름 일부 (비워 두면 PC 기본 마이크. 블루투스 이어폰 마이크는 쓰지 않는다)
# voice = "Yuna"            # 답 읽어 주기 목소리 (Mac 만. say -v '?' 로 목록). Windows 는 한국어 목소리를 저절로 고른다
# speak_powershell = false  # Windows: 읽어 주기는 Windows 음성(SAPI)을 바로 부른다. 그게 안 될 때만 true 면 PowerShell 로 읽는다
#                           # (도우미가 PowerShell 을 띄우는 것을 회사 보안 프로그램이 의심할 수 있어 꺼 둔다)

[keywords]
# 단축키 화면 "키워드" 와 ORCA 세션 팝업의 버튼. 누르면 PC 커서 자리에 text 를 입력하고 Enter 를 누른다.
# text 가 띄어쓰기로 끝나면 Enter 는 누르지 않는다 (뒤에 이어 적을 때).
# 7개까지 (마지막 칸 Tab + Enter 는 늘 있다). name 은 버튼 이름 12자까지, text 는 200자까지 (줄바꿈·탭은 안 됩니다).
# 이 부분을 지우거나 주석으로 두면 아래와 같은 기본 목록을 씁니다. 바꾼 뒤에는 PC 도우미를 다시 켜세요.
# items = [
#   { name = "커밋", text = "커밋해줘" },
#   { name = "배포", text = "배포해줘" },
#   { name = "푸쉬", text = "푸쉬해줘" },
#   { name = "에러 확인", text = "에러 확인" },
#   { name = "/orch", text = "/orchestration " },
#   { name = "/clear", text = "/clear" },
#   { name = "/compact", text = "/compact" },
# ]

[orca]
# ORCA 에 열린 세션들의 작업 상태를 10초마다 기기 ORCA 화면에 보여 준다. 세션을 누르고 말하면 그 세션에 받아 적어 넣는다.
# enabled = true
# 받아쓰기에서 "슬래시 ○○" 를 / 명령으로 바꿀 때, 저절로 못 알아듣는 말을 더한다 (들린 말 = 명령 이름)
# slash_words = { "깃 푸시" = "git-push" }

[mirror]
# 기기 화면을 PC 창으로 보고 조작한다 (USB·Wi-Fi 연결일 때)
# enabled = true
# 기기가 USB·Wi-Fi 로 새로 연결되면 미러링 창을 저절로 연다 (도우미 앱 창으로만)
# auto_open = true

# 저장 위치: PC 용량이 적을 때 큰 것을 다른 드라이브(예: D:)에 둔다. 비워 두면 기본 자리.
# 바꾼 뒤에는 install.cmd 를 다시 실행하세요 (Mac 은 도우미를 다시 켜면 model_dir 만 적용됩니다).
# Windows 경로는 작은따옴표로 적습니다. 예: model_dir = 'D:\LLM Deck\models'  (큰따옴표면 \ 를 \\ 로 두 번)
# 도우미 부품(lib, 약 300MB)은 이 폴더(llm-deck-companion\app) 안에 깔립니다. 폴더째 D: 에 두면 함께 옮겨집니다.
# 사진·동영상 폴더는 위의 [photos] [videos] 에서 정합니다.
[storage]
# 음성 인식 모델 (small 약 480MB, 처음 말로 질문할 때 받는다). 비우면 C:\Users\내이름\.cache\huggingface
# 다른 PC 에서 받아 온 모델 폴더(faster-whisper-small)도 이 폴더 바로 아래에 넣는다 (비우면 .llm-deck\models 아래)
model_dir = ""
# Windows 설치용: 설치할 때 받은 부품 보관함 (수백 MB). 비우면 %LOCALAPPDATA%\pip\cache
cache_dir = ""
# Windows 설치용: 도우미가 쓸 Python (python.exe 경로나 그 폴더). 비우면 이 PC 에 깔린 64비트 3.11~3.14 중 가장 새 것
python = ""
# Windows 설치용: true 면 설치가 끝난 뒤 부품 보관함을 비워 자리를 돌려받는다 (다음 설치 때 다시 받아 조금 느려진다)
clean_cache = false

# 회사망: 보안 프로그램이나 프록시 때문에 설치(install.cmd)에서 받기가 막힐 때만 채웁니다. 보통은 비워 둡니다.
# 설치할 때만 씁니다 (도우미가 켜진 뒤에는 Windows 의 인증서·프록시 설정을 그대로 따릅니다). 바꾼 뒤 install.cmd 를 다시 실행하세요.
[network]
# "certificate", "인증서", "SSL" 오류가 날 때 true. 회사 보안 프로그램이 넣은 Windows 인증서를 믿는다
system_certs = false
# 회사 프록시 주소. 예: proxy = 'http://proxy.example.com:8080'  (모르면 IT 부서에 묻습니다)
proxy = ""
# PyPI(pypi.org)가 막혀 회사 안 부품 저장소를 쓸 때. 예: index_url = 'https://nexus.example.com/repository/pypi/simple'
index_url = ""
# Wi-Fi 로 기기를 연결할 때만 true: 설치할 때 관리자 확인 창을 띄워 Windows 방화벽에 허용 규칙을 둔다 (같은 공유기 안에서 오는 것만).
# 회사 PC 는 보통 USB·블루투스로 쓰니 false 로 둔다 (관리자 권한으로 방화벽을 바꾸는 것을 보안 프로그램이 막을 수 있다)
firewall = false
