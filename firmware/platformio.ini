[platformio]
default_envs = llm-deck

; Waveshare ESP32-S3-Touch-LCD-2 (ESP32-S3R8, 16MB flash, 8MB PSRAM)
[env:llm-deck]
; pioarduino = Arduino core 3.x 를 쓰는 커뮤니티 플랫폼 (공식 PlatformIO 는 2.x 에 머물러 있음)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/build_identity.py

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; 보드의 USB-C 가 ESP32-S3 내장 USB 에 직결되어 있어 Serial 을 USB 로 내보낸다
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; 블루투스 보내기 칸(256B) 수. 기본 12 는 사진을 보낼 때 금방 찬다.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
    ; 블루투스 호스트 버퍼를 PSRAM 에 둔다 (src/nimble_psram.c)
    -Wl,--wrap=nimble_platform_mem_malloc
    -Wl,--wrap=nimble_platform_mem_calloc
    -Iinclude
    ; 스피커 모듈(speaker/)과 같이 쓰는 I2C 약속
    -I../speaker/include

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^2.3.0
    ; OV5640AF 자동 초점 펌웨어 (MIT, 초점 펌웨어 덩어리는 이 저장소에 넣지 않고 받아 쓴다)
    https://github.com/0015/ESP32-OV5640-AF.git#b22b2bc1c1d3ac0f2f18c3f121f82b189889c79e

; 무선(Wi-Fi) 업로드: OTA 지원 펌웨어를 USB 로 한 번 올린 뒤부터 쓸 수 있다.
;   LLMDECK_OTA_PASSWORD=$(cat ~/.llm-deck/ota_password) ~/.local/bin/pio run -e ota -t upload
; 기기 주소가 바뀌었으면 --upload-port <IP> 로 덮어쓴다.
[env:ota]
extends = env:llm-deck
upload_protocol = espota
extra_scripts =
    pre:scripts/build_identity.py
    pre:scripts/ota_port.py
upload_port = llm-deck.local
upload_flags = --auth=${sysenv.LLMDECK_OTA_PASSWORD}
