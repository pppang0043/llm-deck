; Waveshare ESP32-S3-Touch-LCD-2 (ESP32-S3R8, 16MB flash, 8MB PSRAM)
[env:llm-deck]
; pioarduino = Arduino core 3.x 를 쓰는 커뮤니티 플랫폼 (공식 PlatformIO 는 2.x 에 머물러 있음)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; 보드의 USB-C 가 ESP32-S3 내장 USB 에 직결되어 있어 Serial 을 USB 로 내보낸다
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; 블루투스 보내기 칸(256B) 수. 기본 12 는 사진을 보낼 때 금방 찬다.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^2.3.0
