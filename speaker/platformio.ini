; 블루투스 스피커 모듈 (M5Stack ATOM Lite, 원조 ESP32 칩)
; LLM Deck 보드(ESP32-S3)는 블루투스 스피커(클래식 블루투스 A2DP)를 직접 못 쓰므로
; 이 작은 모듈이 I2C 선으로 명령을 받아 스피커에 소리를 보낸다.
;   빌드:   ~/.local/bin/pio run
;   업로드: ~/.local/bin/pio run -t upload --upload-port <ATOM Lite 포트>

[platformio]
default_envs = atom

[env:atom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-atom
framework = arduino
; 블루투스 스택이 커서 기본 분할(1.2MB 앱)로는 모자란다
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps = https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
